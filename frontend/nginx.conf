server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /health {
        proxy_pass http://backend:18080;
    }

    location /ready {
        proxy_pass http://backend:18080;
    }

    location /orders {
        proxy_pass http://backend:18080;
    }

    location /orderbook {
        proxy_pass http://backend:18080;
    }

    location /trades {
        proxy_pass http://backend:18080;
    }

    location /ws {
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
    }
}
